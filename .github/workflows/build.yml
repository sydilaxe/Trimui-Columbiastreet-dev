name: build

on:
  push:
  pull_request:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Publish a GitHub release with this tag (e.g. v0.1.0). Leave empty to just build."
        required: false
        default: ""

jobs:
  trimui:
    name: TrimUI packages (Brick / Brick Hammer, Brick Pro)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          # generated files are committed; keep make from regenerating them
          touch src/font_data.h dist/ColumbiaStreet/icon.png
          pip install ziglang==0.14.1
          make -j"$(nproc)" package
          for d in brick brickpro; do
            z=build/ColumbiaStreet-$d.zip
            ls -l $z
            unzip -l $z | grep -q "Apps/ColumbiaStreet/columbia$"
            unzip -l $z | grep -q "Apps/ColumbiaStreet/breaks/AMEN_153bpm.wav"
            # the self-updater needs these: the CA bundle for HTTPS, and VERSION and DEVICE for install.sh
            unzip -l $z | grep -q "Apps/ColumbiaStreet/cacert.pem"
            test "$(unzip -p $z Apps/ColumbiaStreet/VERSION)" = "$(make -s version)"
            test "$(unzip -p $z Apps/ColumbiaStreet/DEVICE)" = $d
            file build/$d/columbia | grep -q "ARM aarch64"
          done
          # the two builds differ by the Brick Pro's sticks (and the zip each updates from)
          ! cmp -s build/brick/columbia build/brickpro/columbia
          strings build/brick/columbia | grep -qx "/ColumbiaStreet-brick.zip"
          strings build/brickpro/columbia | grep -qx "/ColumbiaStreet-brickpro.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: ColumbiaStreet-trimui
          path: |
            build/ColumbiaStreet-brick.zip
            build/ColumbiaStreet-brickpro.zip

  test:
    name: Engine and UI tests (host)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run the test harness
        run: |
          touch src/font_data.h dist/ColumbiaStreet/icon.png
          sh tools/fetch_samples.sh dist/ColumbiaStreet
          make build/cs_test
          mkdir -p build/test
          build/cs_test build/test dist/ColumbiaStreet | tee build/test/results.txt
      - name: Check the results
        run: |
          r=build/test/results.txt
          grep -q "^samples: 7 banks, 20 bass" $r
          grep -q "0 full-scale samples (want 0)" $r
          grep -q "^grid straight: .*(want all and over 0.99: 1)" $r
          grep -q "^fit: .*(want about half: 1)" $r
          grep -q "^bits  1: 3 output levels" $r
          awk '/^bits  4:/ { exit !($3 + 0 <= 16) }' $r
          grep -q "^comp: .*(want over 6: 1)" $r
          grep -q "^generator: 199 seeds, 0 identical pairs, 0 out of range" $r
          grep -q "^save/load: 1, same 1, bpm 163.5, bits 7, slot D used 1" $r
          grep -q "^bass voices: 24, 0 silent (want 0)" $r
          grep -q "^select: new beat 1, mutes kept 1, mixer kept 1; undo back 1, mutes kept 1" $r
          grep -q "^sync: bpm=140.0 following=1" $r
          grep -q "^sync timing: .*(want under 1 and 2: 1)" $r
          grep -q "^sync timing, a leader without echo: .*(want under 6: 1)" $r
          grep -q "^save compat v0.1: 1, bpm 151, output 0, ppqn 2, pulse 5" $r
          grep -q "^clock out: 2 PPQN at 120 BPM on the right -> 16 pulses in 4 s, mean gap 250.00 ms, width 5.00 ms, other values 0" $r
          grep -q "^clock out: 24 PPQN at 120 BPM on the right -> 192 pulses in 4 s, mean gap 20.83 ms, width 5.00 ms, other values 0" $r
          grep -q "^clock out: 2 PPQN at 120 BPM on the left -> 16 pulses .* other values 0" $r
          grep -q "^clock out stopped: pulses 0 (want 0)" $r
          grep -q "^update prompt: shown 1, A installs 1, B closes it 1, pattern untouched 1" $r
          # USB MIDI clock and the Brick Pro's sticks
          grep -q "^midi clock in: START plays 1 from the first step 1, 120 BPM -> .* (1), phase within .* (want under 0.1: 1), STOP stops 1" $r
          grep -q "^midi clock out: START 1, .*(want 192: 1), STOP 1" $r
          grep -q "^stick: .*(darker: 1), .*(open again: 1); fx: stick 1, R2 first 1, back 1, off 1" $r
      - name: Self-update against a local fake GitHub
        run: make update-test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-output
          path: build/test/

  release:
    name: Publish release
    # runs for: a pushed v* tag, a release created on the website, or a manual run with a tag filled in
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release' || inputs.release_tag != ''
    needs: [trimui, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag matches CS_VERSION
        env:
          TAG: ${{ inputs.release_tag || github.event.release.tag_name || github.ref_name }}
        run: |
          # the app compares the release tag with its own CS_VERSION; a mismatch would offer the update forever
          v=$(sed -n 's/^#define CS_VERSION "\([^"]*\)".*/\1/p' src/engine.h)
          [ "$TAG" = "v$v" ] || { echo "::error::tag $TAG doesn't match CS_VERSION $v in src/engine.h"; exit 1; }
      - uses: actions/download-artifact@v4
        with:
          name: ColumbiaStreet-trimui
      - name: Create the GitHub release with the TrimUI packages
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag || github.event.release.tag_name || github.ref_name }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" ColumbiaStreet-brick.zip ColumbiaStreet-brickpro.zip --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" ColumbiaStreet-brick.zip ColumbiaStreet-brickpro.zip \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Columbia Street $TAG" \
              --notes-file .github/release-notes.md \
              --latest
          fi
