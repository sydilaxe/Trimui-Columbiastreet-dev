name: build

on:
  push:
  pull_request:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Publish a GitHub release with this tag (e.g. v0.1.0). Leave empty to just build."
        required: false
        default: ""

# the release tag, when this run publishes one: a pushed v* tag, a release created on the
# website, or a manual run with release_tag filled in (with or without the v)
env:
  RELEASE_TAG: ${{ inputs.release_tag || github.event.release.tag_name || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || '' }}

jobs:
  trimui:
    name: TrimUI packages (Brick / Brick Hammer, Brick Pro; TrimUI OS and MustardOS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          # generated files are committed; keep make from regenerating them
          touch src/font_data.h dist/ColumbiaStreet/icon.png
          pip install ziglang==0.14.1
          # a release is built as the tag's version (v0.3.1 -> 0.3.1), which the app compares
          # with the latest release's tag to offer updates; otherwise CS_VERSION in src/engine.h
          if [ -n "$RELEASE_TAG" ]; then
            v=${RELEASE_TAG#v}
            echo "$v" | grep -Eqx '[0-9]+(\.[0-9]+)*' || { echo "::error::release tag $RELEASE_TAG isn't v<number>.<number>..."; exit 1; }
          else
            v=$(make -s version)
          fi
          echo "building version $v"
          make -j"$(nproc)" package VERSION="$v"
          for d in brick brickpro; do
            z=build/ColumbiaStreet-$d.zip
            ls -l $z
            unzip -l $z | grep -q "Apps/ColumbiaStreet/columbia$"
            unzip -l $z | grep -q "Apps/ColumbiaStreet/breaks/AMEN_153bpm.wav"
            # the self-updater needs these: the CA bundle for HTTPS, and VERSION and DEVICE for install.sh
            unzip -l $z | grep -q "Apps/ColumbiaStreet/cacert.pem"
            test "$(unzip -p $z Apps/ColumbiaStreet/VERSION)" = "$v"
            test "$(unzip -p $z Apps/ColumbiaStreet/DEVICE)" = $d
            file build/$d/columbia | grep -q "ARM aarch64"
          done
          # MustardOS: the same binaries in "Columbia Street/", with mux_launch.sh and the list glyph
          for d in brick brickpro; do
            z=build/ColumbiaStreet-mustardos-$d.muxapp
            ls -l $z
            unzip -l $z | grep -q "Columbia Street/columbia$"
            unzip -l $z | grep -q "Columbia Street/mux_launch.sh$"
            unzip -l $z | grep -q "Columbia Street/wake_screen.sh$"
            unzip -l $z | grep -q "Columbia Street/glyph/columbiastreet.svg$"
            unzip -l $z | grep -q "Columbia Street/breaks/AMEN_153bpm.wav"
            unzip -l $z | grep -q "Columbia Street/cacert.pem"
            test "$(unzip -p $z "Columbia Street/VERSION")" = "$v"
            test "$(unzip -p $z "Columbia Street/DEVICE")" = $d
            unzip -p $z "Columbia Street/columbia" | cmp -s - build/$d/columbia
            # MustardOS's Archive Manager refuses absolute and .. paths, and anything not a file or folder
            # (a bare "! cmd" can't fail a step under set -e, hence the ifs)
            if unzip -Z1 $z | grep -Eq '^/|(^|/)\.\.(/|$)|\\'; then echo "::error::$z has unsafe paths"; exit 1; fi
            if unzip -Zl $z | grep -Eq '^[bclps]'; then echo "::error::$z has links or devices"; exit 1; fi
            # the TrimUI OS zip must not carry mux_launch.sh: it is how the app tells the packages apart
            if unzip -l build/ColumbiaStreet-$d.zip | grep -q mux_launch.sh; then
              echo "::error::ColumbiaStreet-$d.zip has mux_launch.sh"; exit 1
            fi
          done
          # the two builds differ by the Brick Pro's sticks (and the packages each updates from)
          if cmp -s build/brick/columbia build/brickpro/columbia; then echo "::error::the two builds are the same"; exit 1; fi
          strings build/brick/columbia | grep -qx "/ColumbiaStreet-brick.zip"
          strings build/brickpro/columbia | grep -qx "/ColumbiaStreet-brickpro.zip"
          strings build/brick/columbia | grep -qx "/ColumbiaStreet-mustardos-brick.muxapp"
          strings build/brickpro/columbia | grep -qx "/ColumbiaStreet-mustardos-brickpro.muxapp"
          # the version the binaries were built as, which the updater compares with the release
          strings build/brick/columbia | grep -qx "THIS IS V$v"
          strings build/brickpro/columbia | grep -qx "THIS IS V$v"
      - uses: actions/upload-artifact@v4
        with:
          name: ColumbiaStreet-trimui
          path: |
            build/ColumbiaStreet-brick.zip
            build/ColumbiaStreet-brickpro.zip
            build/ColumbiaStreet-mustardos-brick.muxapp
            build/ColumbiaStreet-mustardos-brickpro.muxapp

  test:
    name: Engine and UI tests (host)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run the test harness
        run: |
          touch src/font_data.h dist/ColumbiaStreet/icon.png
          sh tools/fetch_samples.sh dist/ColumbiaStreet
          make build/cs_test
          mkdir -p build/test
          build/cs_test build/test dist/ColumbiaStreet | tee build/test/results.txt
      - name: Check the results
        run: |
          r=build/test/results.txt
          grep -q "^samples: 7 banks, 20 bass" $r
          grep -q "0 full-scale samples (want 0)" $r
          grep -q "^grid straight: .*(want all and over 0.99: 1)" $r
          grep -q "^fit: .*(want about half: 1)" $r
          grep -q "^bits  1: 3 output levels" $r
          awk '/^bits  4:/ { exit !($3 + 0 <= 16) }' $r
          grep -q "^comp: .*(want over 6: 1)" $r
          grep -q "^generator: 199 seeds, 0 identical pairs, 0 out of range" $r
          grep -q "^save/load: 1, same 1, bpm 163.5, bits 7, slot D used 1" $r
          grep -q "^bass voices: 24, 0 silent (want 0)" $r
          grep -q "^select: new beat 1, mutes kept 1, mixer kept 1; undo back 1, mutes kept 1" $r
          grep -q "^sync: bpm=140.0 following=1" $r
          grep -q "^sync timing: .*(want under 1 and 2: 1)" $r
          grep -q "^sync timing, a leader without echo: .*(want under 6: 1)" $r
          grep -q "^save compat v0.1: 1, bpm 151, output 0, ppqn 2, pulse 5" $r
          grep -q "^save compat v0.3: 1, bpm 147, scenes 0" $r
          # the mute scenes (F1 / F2, R2 + L1 / R1) and the LEDs (into a stand-in for the driver)
          grep -q "^scenes: saved 1, empty does nothing 1, on 1, off 1, R2+L1 1, swap 1, back 1, kept 1" $r
          grep -q "^leds: driven 1, F1 lit, F2 dark, bar orange 1, level in the loudest channel's colour 1 (.*), restored 1" $r
          grep -q "^clock out: 2 PPQN at 120 BPM on the right -> 16 pulses in 4 s, mean gap 250.00 ms, width 5.00 ms, other values 0" $r
          grep -q "^clock out: 24 PPQN at 120 BPM on the right -> 192 pulses in 4 s, mean gap 20.83 ms, width 5.00 ms, other values 0" $r
          grep -q "^clock out: 2 PPQN at 120 BPM on the left -> 16 pulses .* other values 0" $r
          grep -q "^clock out stopped: pulses 0 (want 0)" $r
          grep -q "^update prompt: shown 1, A installs 1, B closes it 1, pattern untouched 1" $r
          # USB MIDI clock and the Brick Pro's sticks
          grep -q "^midi clock in: START plays 1 from the first step 1, 120 BPM -> .* (1), phase within .* (want under 0.1: 1), STOP stops 1" $r
          grep -q "^midi cc: .*CC7 not ours: 1$" $r
          grep -q "^midi notes: channel 1 plays break 1 1, channel 5 the bass at A2 1 .*let go fades 1" $r
          # the MIDI chart's CC table is the one the app uses
          build/cs_test --midi-chart > cc.md
          sed -n '/<!-- cc table -->/,/<!-- end cc table -->/p' docs/MIDI.md | sed '1d;$d' | diff cc.md -
          grep -q "^midi clock out: START 1, .*(want 192: 1), STOP 1" $r
          grep -q "^stick: .*(darker: 1), .*(open again: 1); fx: stick 1, R2 first 1, back 1, off 1" $r
      - name: Self-update against a local fake GitHub
        run: make update-test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-output
          path: build/test/

  release:
    name: Publish release
    # runs for: a pushed v* tag, a release created on the website, or a manual run with a tag filled in
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release' || inputs.release_tag != ''
    needs: [trimui, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ColumbiaStreet-trimui
      - name: Check the packages are the tag's version
        run: |
          # the trimui job built them as the tag's version; a mismatch would make the app offer
          # this update forever. A manual run's tag may leave out the v.
          TAG=v${RELEASE_TAG#v}
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          for d in brick brickpro; do
            test "$(unzip -p ColumbiaStreet-$d.zip Apps/ColumbiaStreet/VERSION)" = "${TAG#v}" ||
              { echo "::error::ColumbiaStreet-$d.zip isn't version ${TAG#v}"; exit 1; }
            test "$(unzip -p ColumbiaStreet-mustardos-$d.muxapp "Columbia Street/VERSION")" = "${TAG#v}" ||
              { echo "::error::ColumbiaStreet-mustardos-$d.muxapp isn't version ${TAG#v}"; exit 1; }
          done
      - name: Create the GitHub release with the TrimUI OS and MustardOS packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files="ColumbiaStreet-brick.zip ColumbiaStreet-brickpro.zip ColumbiaStreet-mustardos-brick.muxapp ColumbiaStreet-mustardos-brickpro.muxapp"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" $files --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" $files \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Columbia Street $TAG" \
              --notes-file .github/release-notes.md \
              --latest
          fi
